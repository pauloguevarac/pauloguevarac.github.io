---
layout: matrix-base
---
<section class="page-body">
  <div class="page-hero">
    <div class="k">// tag</div>
    <h1>#{{ page.title }}</h1>
    <p style="color:var(--muted);margin-top:10px">{{ page.posts.size }} post(s)</p>
  </div>

  <ul class="m-list">
    {% for post in page.posts %}
    <li>
      <span class="d">{{ post.date | date: "%b %d, %Y" }}</span>
      <a href="{{ post.url }}">{{ post.title }}</a>
    </li>
    {% endfor %}
  </ul>
</section>
