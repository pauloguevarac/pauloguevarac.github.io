---
layout: matrix-base
---
<section class="page-body">
  <article>
    <header class="post-header">
      <h1>{{ page.title }}</h1>
      <div class="post-meta">
        <span>Posted {{ page.date | date: "%b %d, %Y" }}</span>
        <span class="sep">·</span>
        <span>By Paulo Guevara</span>
        {% if page.categories.size > 0 %}
        <span class="sep">·</span>
        <span>{% for cat in page.categories %}<a href="/categories/">{{ cat }}</a>{% unless forloop.last %} / {% endunless %}{% endfor %}</span>
        {% endif %}
      </div>
    </header>
    <div class="post-content">
      {{ content }}
    </div>
  </article>
</section>
